<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>白塔巷 17 号 · 雾汀</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="backdrop" id="backdrop"></div>
<div class="hero">
  <div class="topbar">
    <a href="../index.html" class="link-btn" style="text-decoration:none;">← 雾汀地图</a>
    <span class="spacer"></span>
    <span class="seed-tag" id="seed-tag">种子 #—</span>
    <button class="link-btn" id="btn-new">换一局</button>
    <button class="link-btn" id="btn-restart">重新开始</button>
  </div>

  <div class="hero-title">
  <h1>白塔巷 17 号</h1>
  <p class="sub">你刚搬进 302 室 —— 上一位住客陈聿的房间。<br>
  这栋楼三天后要拆了。你有三个晚上，弄清楚陈聿留下了什么。</p>
  </div>
</div>
<div class="wrap">
  <div class="card">
    <p class="meta">怎么玩</p>
    <p>每晚 4 个行动点。走动不花点，看东西、问人、拿东西、开箱子花 1 点。东西很多，时间不够——你得选。第三天早上，拆迁队来了，你要做最后的决定。</p>
    <button class="btn" id="btn-help">复制求援提示词<span class="hint">把你当前看到的局面整理好，贴给你的 AI 一起推理（只含已见信息，不含答案）</span></button>
  </div>

  <div id="game"></div>

  <p class="small">进度自动保存在本机浏览器里，刷新不丢。种子号在页面上方，分享同一局给别人时，把带 ?seed= 的链接发过去就行。</p>
</div>
<script src="../assets/backdrops.js"></script>
<script src="../assets/common.js"></script>
<script>window.FogBackdrop.mount("baita", document.getElementById("backdrop"));</script>
<script src="game.js"></script>
</body>
</html>
